name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Run flake checks
        run: nix flake check

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.0.0 --locked

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Verify Zig installation
        run: zig version

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Validate Debian package build
        run: cargo deb --no-build

      - name: Validate SBOM generation
        env:
          SBOM_BASE_NAME: zfshealth-ci.cdx
        run: |
          cargo cyclonedx --format json --override-filename "$SBOM_BASE_NAME"
          test -f "$SBOM_BASE_NAME.json"

      - name: Validate static musl binary build
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl
